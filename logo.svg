<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgG" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic 3D Gold Gradient -->
    <linearGradient id="goldG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Royal Blue Gradient -->
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Phone Screen Gradient -->
    <linearGradient id="screenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Diaper Gradient -->
    <linearGradient id="diaperG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgG)" />

  <!-- Outer Octagon Gold Frame -->
  <polygon points="256,24 432,97 505,256 432,415 256,488 80,415 7,256 80,97" 
           fill="none" stroke="url(#goldG1)" stroke-width="8" filter="url(#shadow3D)" />

  <!-- Inner Royal Blue Shield -->
  <polygon points="256,44 414,110 480,256 414,402 256,468 98,402 32,256 98,110" 
           fill="url(#blueG)" opacity="0.4" />

  <!-- [1] 3D Smartphone on Left -->
  <g transform="translate(130, 160)" filter="url(#shadow3D)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="130" height="230" rx="24" fill="#020617" stroke="url(#goldG1)" stroke-width="4" />
    <!-- Screen -->
    <rect x="7" y="7" width="116" height="216" rx="18" fill="url(#screenG)" />
    <!-- Dynamic Notch -->
    <rect x="42" y="12" width="46" height="7" rx="3.5" fill="#000000" />
    <!-- Metric Chart Bar -->
    <rect x="16" y="32" width="98" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="47" font-family="sans-serif" font-size="7" fill="#94a3b8" font-weight="bold">MIRZA SALE</text>
    <text x="24" y="65" font-family="sans-serif" font-size="13" fill="#34d399" font-weight="bold">Rs. 48,500</text>
    <!-- 4 mini category tiles -->
    <rect x="16" y="82" width="45" height="28" rx="5" fill="#312e81" />
    <text x="24" y="101" font-size="12">👶</text>
    <rect x="69" y="82" width="45" height="28" rx="5" fill="#065f46" />
    <text x="77" y="101" font-size="12">📱</text>
    <rect x="16" y="116" width="45" height="28" rx="5" fill="#7c2d12" />
    <text x="24" y="135" font-size="12">💳</text>
    <rect x="69" y="116" width="45" height="28" rx="5" fill="#4c1d95" />
    <text x="77" y="135" font-size="12">⚡</text>
  </g>

  <!-- [2] 3D Soft Diaper on Right -->
  <g transform="translate(265, 190)" filter="url(#shadow3D)">
    <path d="M 30 50 Q 85 10 150 30 Q 195 50 190 120 Q 180 180 135 200 Q 80 210 35 180 Q 5 140 10 90 Z" 
          fill="url(#diaperG)" stroke="#e2e8f0" stroke-width="3" />
    <path d="M 22 85 Q 8 125 28 160 Q 40 178 60 186" 
          fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />
    <path d="M 185 110 Q 188 150 162 182 Q 142 198 125 204" 
          fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
    <rect x="42" y="55" width="105" height="26" rx="6" fill="#bfdbfe" opacity="0.6" />
    <circle cx="95" cy="115" r="16" fill="#fef08a" stroke="url(#goldG1)" stroke-width="2" />
    <text x="89" y="122" font-family="sans-serif" font-size="14" font-weight="black" fill="#78350f">M</text>
  </g>

  <!-- [3] Bottom Gold Shield Badge "M" -->
  <g transform="translate(256, 442)">
    <polygon points="0,-24 22,-10 22,14 0,28 -22,14 -22,-10" 
             fill="url(#goldG1)" stroke="#ffffff" stroke-width="1.5" filter="url(#shadow3D)" />
    <text x="0" y="8" font-family="sans-serif" font-size="16" font-weight="black" fill="#0f172a" text-anchor="middle">M</text>
  </g>
</svg>